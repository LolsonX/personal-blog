name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://core-code.net
    permissions:
      contents: read
    env:
      HOST: ${{ vars.HOST }}
      PORT: ${{ vars.PORT }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      EDITOR_USERNAME: ${{ secrets.EDITOR_USERNAME }}
      EDITOR_PASSWORD_HASH: ${{ secrets.EDITOR_PASSWORD_HASH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.21.0

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          shards install
          crystal tool format --check
          mkdir -p bin
          crystal build --release src/app.cr -o bin/app
          test -x bin/app

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install environment file
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: /srv/www/core-code.net
          SSH_OPTS: -T -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          bash scripts/render-env.sh > "$tmp"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077 && cat > '$DEPLOY_PATH/core-code.env.tmp' && chmod 600 '$DEPLOY_PATH/core-code.env.tmp'" < "$tmp"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: /srv/www/core-code.net
          SSH_OPTS: -T -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          set -e
          rsync -q --chmod=F755 -e "ssh $SSH_OPTS" \
            bin/app "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/app.new"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv -f $DEPLOY_PATH/core-code.env.tmp $DEPLOY_PATH/core-code.env && mv -f $DEPLOY_PATH/app.new $DEPLOY_PATH/app && sudo systemctl restart personal-blog"

      - name: Verify
        env:
          DEPLOY_URL: https://core-code.net
        run: |
          deployed_sha="$(curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 "$DEPLOY_URL/deployment")"
          test "$deployed_sha" = "$GITHUB_SHA"