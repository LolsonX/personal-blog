name: CI

on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.21.0

      - name: Build and smoke test
        env:
          GIT_SHA: test
        run: |
          shards install
          crystal tool format --check
          crystal build --release src/app.cr -o bin/app
          HOST=127.0.0.1 PORT=3100 GIT_SHA=test bin/app > /tmp/app.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3100/deployment > /dev/null && break
            sleep 1
          done
          test "$(curl --fail --silent http://127.0.0.1:3100/deployment)" = "test"
          curl --fail --silent http://127.0.0.1:3100/ | grep -q '<h1>core-code.net</h1>'