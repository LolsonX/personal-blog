name: Deploy environment

on:
  push:
    branches: [main]
    paths:
      - .env.example
      - .github/workflows/env.yml
      - scripts/render-env.sh
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      HOST: ${{ vars.HOST }}
      PORT: ${{ vars.PORT }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      EDITOR_USERNAME: ${{ secrets.EDITOR_USERNAME }}
      EDITOR_PASSWORD_HASH: ${{ secrets.EDITOR_PASSWORD_HASH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 400 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Write environment file
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          ENV_FILE_PATH: ${{ vars.ENV_FILE_PATH }}
          SSH_OPTS: -T -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          remote_path="${ENV_FILE_PATH:-/srv/www/core-code.net/core-code.env}"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          bash scripts/render-env.sh > "$tmp"
          ssh $SSH_OPTS "$remote" \
              "umask 077 && cat > '$remote_path.tmp' && chmod 600 '$remote_path.tmp' && mv -f '$remote_path.tmp' '$remote_path'" < "$tmp"

          echo "installed: $remote:$remote_path"

      - name: Restart service
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          UNIT_NAME: ${{ vars.UNIT_NAME }}
          SSH_OPTS: -T -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          set -euo pipefail
          unit="${UNIT_NAME:-personal-blog}"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl restart '$unit'"

      - name: Verify health
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          url="${DEPLOY_URL:-https://core-code.net}"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 "$url/health" | grep -q "ok"